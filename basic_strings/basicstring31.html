<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome,     45 to India!                    1821";
      let result = "";
      for (let i = 0; i < str1.length; i++) {
        if (str1[i] == " ") {
          if (str1[i - 1] == " ") {
            continue;
          } else {
            result += " ";
          }
        } else {
          result += str1[i];
        }
      }

      console.log(
        "String after replacing multiple space with single space characters = " +
          result,
      );
    </script>
  </body>
</html>

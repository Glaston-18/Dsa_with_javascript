<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome, 45 to India! 1821 the the the Welcome,";
      let splitStrings = str1.split(" ");
      let count = 0;
      let result = "";
      for (let i = 0; i < splitStrings.length; i++) {
        count = 1;
        if (!result.includes(splitStrings[i])) {
          for (let j = i + 1; j < splitStrings.length; j++) {
            if (splitStrings[i] == splitStrings[j]) {
              count++;
              result += splitStrings[i];
            } else {
              continue;
            }
          }
          console.log(`Count of string ${splitStrings[i]} = ${count}`);
        }
      }
    </script>
  </body>
</html>

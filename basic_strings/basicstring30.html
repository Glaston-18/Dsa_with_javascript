<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome, 45 to India! 1821";
      let result = "";
      let char = "e";
      for (let i = 0; i < str1.length; i++) {
        if (str1[i] == char) {
          result += "$";
        } else {
          result += str1[i];
        }
      }

      console.log("String after replacing specific characters = " + result);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome to india!";
      let count = 0;
      for (let i = 0; i < str1.length; i++) {
        console.log(str1[i]);

        // debugger;

        if (
          (str1.charCodeAt(i) >= 65 && str1.charCodeAt(i) <= 90) ||
          (str1.charCodeAt(i) >= 97 && str1.charCodeAt(i) <= 122)
        ) {
          if (
            str1[i] != "a" &&
            str1[i] != "A" &&
            str1[i] != "e" &&
            str1[i] != "E" &&
            str1[i] != "i" &&
            str1[i] != "I" &&
            str1[i] != "o" &&
            str1[i] != "O" &&
            str1[i] != "u" &&
            str1[i] != "U"
          ) {
            count += 1;
          }
        }
      }
      console.log("consonant count = " + count);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome, 45 to India! 1821";
      let unique = "";
      for (let i = 0; i < str1.length; i++) {
        for (let j = i + 1; j < str1.length; j++) {
          if (str1[i] == str1[j] && str1[i] != " ") {
            continue;
          } else {
            if (!unique.includes(str1[i]) && str1[i] != " ") {
              unique += str1[i];
            }
          }
        }
      }

      console.log("After removal = " + '"' + unique + '"');
    </script>
  </body>
</html>

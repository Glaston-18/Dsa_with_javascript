<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "1245639875 78541!";
      let invalid = false;
      for (let i = 0; i < str1.length; i++) {
        if (
          (str1.charCodeAt(i) >= 48 && str1.charCodeAt(i) <= 57) ||
          str1.charCodeAt(i) == 32
        ) {
          continue;
        } else {
          invalid = true;
          break;
        }
      }
      if (invalid) {
        console.log("The string includes characters other than numbers too...");
      } else {
        console.log("The string only contains numbers");
      }
    </script>
  </body>
</html>

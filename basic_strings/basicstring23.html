<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Apple";
      let char = "p";

      let count = 0;

      for (let i = 0; i < str1.length; i++) {
        if (str1[i] == char) {
          count++;
        }
      }

      console.log("Frequency of " + char + " = " + count);
    </script>
  </body>
</html>

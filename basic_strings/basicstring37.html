<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      let str1 = "Welcome, 45 to India! 1821";
      let str2 = " Its a world cup final today!";
      for (let i = 0; i < str2.length; i++) {
        if (i == 0) {
          str1.push(" ");
        } else {
          str1.push(str2[i]);
        }
      }
      console.log("String = " + str1);
    </script>
  </body>

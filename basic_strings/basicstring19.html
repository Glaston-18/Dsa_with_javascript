<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "";
      let str2 = "Apple";
      let result = "";

      for (let i = 0; i < str1.length; i++) {
        if (str1.charCodeAt(i) == str2.charCodeAt(i)) {
          result = "No difference has been found so far.";
        } else if (str1.charCodeAt(i) > str2.charCodeAt(i)) {
          result = "String 2 is alphabetically prior to String 1";
          break;
        } else if (str1.charCodeAt(i) < str2.charCodeAt(i)) {
          result = "String 1 is alphabetically prior to String 2";
          break;
        }
      }

      if (
        result == "No difference has been found so far." &&
        str1.length == str2.length
      ) {
        result = "No change of order , both words are alphabetically equal";
      } else if (
        result == "No difference has been found so far." &&
        str1.length < str2.length
      ) {
        result = "String 1 is alphabetically prior to String 2";
      } else if (
        result == "No difference has been found so far." &&
        str2.length < str1.length
      ) {
        result = "String 2 is alphabetically prior to String 1";
      } else if (str1.length == 0 || str2.length == 0) {
        result = "Invalid inputs.";
      }

      console.log("Result = " + result);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome 45 to India! 1821";
      let count = 0;

      for (let i = 0; i < str1.length; i++) {
        if (str1.charCodeAt(i) >= 97 && str1.charCodeAt(i) <= 122) {
          count++;
        }
      }

      console.log("Lowercase count = " + count);
    </script>
  </body>
</html>

<html lang="en">

  <body>
    <script>
      let str1 = "level";
      let result = "";
      for (let i = str1.length - 1; i >= 0; i--) {
        result += str1[i];
      }
      if (str1 == result) {
        console.log("Its a palindrome");
      } else {
        console.log("Its not a palindrome");
      }
    </script>
  </body>

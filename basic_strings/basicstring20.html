<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Apple";
      let char = "e";
      let result = "";
      for (let i = 0; i < str1.length; i++) {
        if (str1[i] == char) {
          result = "Character found = " + str1[i] + " at index " + i;
          break;
        } else {
          result = "No character matches";
        }
      }
      console.log("Final result = " + result);
    </script>
  </body>
</html>

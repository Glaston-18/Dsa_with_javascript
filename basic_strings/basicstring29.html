<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome, 45 to India! 1821";
      let result = "";
      for (let i = 0; i < str1.length; i++) {
        if (
          str1[i] == "a" ||
          str1[i] == "A" ||
          str1[i] == "e" ||
          str1[i] == "E" ||
          str1[i] == "i" ||
          str1[i] == "I" ||
          str1[i] == "o" ||
          str1[i] == "O" ||
          str1[i] == "u" ||
          str1[i] == "U"
        ) {
          continue;
        } else {
          result += str1[i];
        }
      }

      console.log("String after removing vowel characters = " + result);
    </script>
  </body>
</html>

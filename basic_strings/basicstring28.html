<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "Welcome, 45 to India! 1821";
      let result = "";
      for (let i = 0; i < str1.length; i++) {
        if (
          (str1.charCodeAt(i) >= 33 && str1.charCodeAt(i) <= 47) ||
          (str1.charCodeAt(i) >= 58 && str1.charCodeAt(i) <= 64) ||
          (str1.charCodeAt(i) >= 91 && str1.charCodeAt(i) <= 96) ||
          (str1.charCodeAt(i) >= 123 && str1.charCodeAt(i) <= 126)
        ) {
          continue;
        } else {
          result += str1[i];
        }
      }

      console.log("String after removing special characters = " + result);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr1 = [4, 5, 6, 7, 34, 2, 12, 7, 17, 45, 35, 10, 7];
      let odd = [];
      let even = [];
      for (let i = 0; i < arr1.length; i++) {
        if (arr1[i] % 2 == 0) {
          even.push(arr1[i]);
        } else if (arr1[i] % 2 != 0) {
          odd.push(arr1[i]);
        }
      }

      console.log("Even = " + even);
      console.log("Odd = " + odd);
    </script>
  </body>
</html>

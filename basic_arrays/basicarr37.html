<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr1 = [
        4, 5, 6, 7, 0, 34, 2, 0, 12, 6, 4, 5, 6, 17, 0, 45, 35, 5, 4, 0, 12,
      ];

      let num = 6;
      let count = 0;
      for (let i = 0; i < arr1.length; i++) {
        if (arr1[i] > num) {
          count++;
        }
      }
      console.log("Number of elements greater than " + num + " = " + count);
    </script>
  </body>
</html>

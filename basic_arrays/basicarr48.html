<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr1 = [11, 1, 2, 19, 3, 4, 14, 16, 5, 8, 10];
      let arr2 = [1, 2, 3, 4, 5, 7, 8, 9, 10, 11, 7, 9, 14, 16];
      let uncommon = [];

      for (let i = 0; i < arr1.length; i++) {
        for (let j = 0; j < arr2.length; j++) {
          if (arr1[i] == arr2[j]) {
            break;
          } else if (arr1[i] !== arr2[j] && j == arr2.length - 1) {
            if (!uncommon.includes(arr1[i])) {
              uncommon.push(arr1[i]);
            }
          }
        }
      }
      console.log("Uncommon elements = " + uncommon);
    </script>
  </body>
</html>

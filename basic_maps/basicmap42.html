<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let map1 = new Map();

      map1.set("glaston", 96);
      map1.set("alice", 85);
      map1.set("daniel", 64);
      let sum = 0;

      map1.forEach((element, key) => {
        sum += element;
      });
      console.log(`Average of '${map1.size} elements' is ${sum / map1.size}`);
    </script>
  </body>
</html>

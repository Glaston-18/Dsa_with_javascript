<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      let map1 = new Map();

      map1.set("glaston", 57);
      map1.set("alice", 22);
      map1.set("daniel", 55);
      let min = map1.values().next().value; //key part of the problem

      map1.forEach((element, key) => {
        if (element < min) {
          min = element;
        }
      });
      console.log(min);
    </script>
  </body>

  <body>
    <script>
      let map1 = new Map();

      map1.set("glaston", 5);
      map1.set("alice", 4);
      map1.set("daniel", 3);
      map1.set("vance", 4);
      map1.set("lance", 2);

      const arr1 = [];

      for (x of map1.values()) {
        arr1.push(x);
      }

      const result = arr1.sort((a, b) => a - b);

      console.log(result);
    </script>
  </body>

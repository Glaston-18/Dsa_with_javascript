  <body>
    <script>
      const user = {
        name: "glaston",
        yoe: 4,
        yop: 2022,
      };
      const map1 = new Map();

      Object.entries(user).forEach((element, index) => {
        map1.set(element[0], element[1]);
      });

      map1.forEach((element, key) => {
        console.log(`${key} = ${element}`);
      });

      console.log(map1);
    </script>

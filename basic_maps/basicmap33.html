<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let map1 = new Map();
      let keyChar = "l";
      let currentKey = "";

      map1.set("glaston", 96);
      map1.set("alice", 85);
      map1.set("daniel", 64);
      map1.set("vance", 82);
      map1.set("lance", 68);

      map1.forEach((element, key) => {
        currentKey = key;
        if (currentKey.startsWith(keyChar)) {
          map1.delete(key);
        }
      });

      console.log(map1);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let map1 = new Map();
      let map2 = new Map();

      map1.set("glaston", 5);
      map1.set("alice", 4);
      map1.set("daniel", 3);
      map1.set("lance", 2);

      map1.forEach((element, key) => {
        map2.set(element, key);
        map1.delete(key);
      });

      console.log(map2);
    </script>
  </body>
</html>

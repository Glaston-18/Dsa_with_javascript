<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let map1 = new Map();
      let map2 = new Map();

      map1.set("glaston", 5);
      map1.set("alice", 4);
      map1.set("daniel", 3);
      map1.set("lance", 2);
      map1.set("andrew", 5);
      map1.set("james", 5);
      map1.set("konan", 3);

      let duplicates = [];

      map1.forEach((element, key) => {
        if (map2.has(element)) {
          let currentElement = map2.get(element);
          map2.set(element, ++currentElement);
        } else {
          map2.set(element, 1);
        }
      });

      map2.forEach((element, key) => {
        if (element > 1) {
          duplicates.push(key);
        }
      });

      console.log(duplicates);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numbersArray = [1, 2, 3, 4, 5];
      let numbersSet = new Set(numbersArray);
      let count = 0;
      let number = 1;

      numbersSet.forEach((num) => {
        if (num > number) {
          count++;
        }
      });

      console.log(`Number of elements greater than ${number} = ${count}`);
    </script>
  </body>
</html>

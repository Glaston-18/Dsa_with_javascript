  <body>
    <script>
      let numbersArray = [20, 24, 4, 5, 28, 32, 1, 2, 3, 16];
      let numbersSet = new Set();
      let newArray = [];

      let count = 0;
      let number = 4;

      numbersArray.forEach((num) => {
        numbersSet.add(num);
      });

      numbersSet.forEach((num) => {
        newArray.push(num);
      });

      newArray.sort((a, b) => a - b);

      console.log(`Sorted order = ${newArray}`);
    </script>

  <body>
    <script>
      let numbersArray = [1, 2, 3, 4, 5];
      let numbersSet = new Set();

      numbersArray.forEach((num) => {
        if (num % 2 != 0) {
          numbersSet.add(num);
        }
      });

      console.log(numbersSet);
    </script>

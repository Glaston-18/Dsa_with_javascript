<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numbersArray = [1, 2, 3, 4, 5];
      let numbersSet = new Set(numbersArray);
      let sum = 0;

      numbersSet.forEach((num) => {
        sum += num;
      });

      console.log(
        "Average of all elements in the set is " + sum / numbersSet.size,
      );
    </script>
  </body>
</html>

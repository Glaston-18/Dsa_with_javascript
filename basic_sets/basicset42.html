<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "welcome to india";

      let newSet = new Set();

      for (let i = 0; i < str1.length; i++) {
        newSet.add(str1.charAt(i));
      }

      console.log("count of unique letters = " + newSet.size);
    </script>
  </body>
</html>

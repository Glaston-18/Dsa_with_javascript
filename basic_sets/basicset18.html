<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numbersArray = [1, 2, 3, 4, , 23, 45, 98, 21, 15, 5];
      let numbersSet = new Set(numbersArray);
      let max = numbersSet.values().next().value;

      numbersSet.forEach((num) => {
        if (num > max) {
          max = num;
        }
      });

      console.log("Maximum in the set is " + max);
    </script>
  </body>
</html>

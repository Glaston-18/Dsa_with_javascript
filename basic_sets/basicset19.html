<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numbersArray = [1, 2, 3, 4, , 23, 45, 98, 21, 15, 5];
      let numbersSet = new Set(numbersArray);
      let min = numbersSet.values().next().value;

      numbersSet.forEach((num) => {
        if (num < min) {
          min = num;
        }
      });

      console.log("Minimum in the set is " + min);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr1 = [1, 4, 5, 6, 7];
      let arr2 = [1, 5, 6, 4, 7, 3, 5, 1];
      let arr1Set = new Set();
      let arr2Set = new Set();

      let count = 0;
      let result = "";

      arr1.forEach((element) => {
        arr1Set.add(element);
      });

      arr2.forEach((element) => {
        arr2Set.add(element);
      });

      if (arr1Set.size == arr2Set.size) {
        result += "2 Arrays contains same unique elements";
      } else {
        result += "2 Arrays contains different elements";
      }

      console.log(result);
    </script>
  </body>
</html>
